# Cloudflare Workers — Workers Builds (Git) settings:
#
#   Build command:  npm run build
#   Deploy command: node scripts/wrangler-deploy-ci.mjs
#   Root directory:  /
#   Node.js:        22
#
# No [build] in wrangler.toml — Workers Builds already runs npm run build;
# a wrangler [build] step would run vite twice and often fail the deploy step.

name = "apnainternsite"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
LAMBDA_ORIGIN = "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com"
LAMBDA_STAGE = "staging"
MAIL_FROM_ADDRESS = "info@apnaintern.in"
# OTP is relayed to Vercel (Amazon SES SMTP). Do not send from the Worker — Mail Manager dropped mail.
VERCEL_MAIL_ORIGIN = "https://apnainternsite.vercel.app"
