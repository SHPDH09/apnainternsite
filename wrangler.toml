# Cloudflare Workers — build: npm run build | deploy: npx wrangler deploy
# API paths proxy to Lambda via cloudflare/worker.ts (not _redirects — Workers forbid external proxy).

name = "apnainternsite"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
LAMBDA_ORIGIN = "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com"
LAMBDA_STAGE = "staging"
