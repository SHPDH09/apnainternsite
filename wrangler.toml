# Cloudflare Workers — Workers Builds (Git) settings:
#
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
#   Root directory:  /
#   Node.js:        22
#
# Do NOT use "Retry" after seed_repo builds — use Create deployment.
# Do NOT use wrangler pages deploy (this is a Worker + static assets, not Pages).

name = "apnainternsite"
main = "cloudflare/worker.ts"
compatibility_date = "2024-09-23"

[build]
command = "npm run build"
watch_dir = "src"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

[vars]
LAMBDA_ORIGIN = "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com"
LAMBDA_STAGE = "staging"
