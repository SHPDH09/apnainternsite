# Cloudflare Pages — build on every push; deploy via workflow_dispatch or Cloudflare Git integration.
#
# Option A (recommended): Cloudflare dashboard → Connect GitHub repo → auto-deploy on push
# Option B: GitHub Secrets → CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID → Run workflow manually

name: Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_URL: https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com/staging
          VITE_SUPABASE_PUBLISHABLE_KEY: local-anon-key
          VITE_SUPABASE_PROJECT_ID: apnaintern-local
          VITE_SITE_API_ORIGIN: https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com/staging

      - name: Verify Cloudflare routing files in dist
        run: test -f dist/_redirects && test -f dist/_headers && head -5 dist/_redirects

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name=apna-intern --commit-dirty=true
