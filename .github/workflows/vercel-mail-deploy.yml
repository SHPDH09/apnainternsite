# Redeploy Vercel production when mail/OTP API changes (requires Vercel GitHub integration or secrets).

name: Vercel Mail Deploy

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "vercel.json"
      - ".vercelignore"
      - ".github/workflows/vercel-mail-deploy.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_SUPABASE_PUBLISHABLE_KEY: local-anon-key
          VITE_SUPABASE_PROJECT_ID: apnaintern-local

      - name: Sync Vercel production env (when token configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DATABASE_URL: ${{ secrets.DATABASE_URL || secrets.TARGET_DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.hostinger.com' }}
          SMTP_USER: ${{ secrets.SMTP_USER || 'info@apnaintern.in' }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM_ADDRESS: ${{ secrets.MAIL_FROM_ADDRESS || 'info@apnaintern.in' }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::Set VERCEL_TOKEN and VERCEL_PROJECT_ID to sync Vercel production env"
            exit 0
          fi
          if [ -n "${DATABASE_URL:-}" ]; then
            printf '%s' "$DATABASE_URL" | npx vercel env add DATABASE_URL production --token "$VERCEL_TOKEN" --yes 2>/dev/null || \
              (npx vercel env rm DATABASE_URL production --token "$VERCEL_TOKEN" --yes 2>/dev/null; \
               printf '%s' "$DATABASE_URL" | npx vercel env add DATABASE_URL production --token "$VERCEL_TOKEN" --yes)
            for key in RDS_IAM_AUTH AWS_RDS_REGION AWS_DEFAULT_REGION; do
              val=""
              case "$key" in RDS_IAM_AUTH) val="true" ;; AWS_RDS_REGION|AWS_DEFAULT_REGION) val="ap-south-2" ;; esac
              printf '%s' "$val" | npx vercel env add "$key" production --token "$VERCEL_TOKEN" --yes 2>/dev/null || \
                (npx vercel env rm "$key" production --token "$VERCEL_TOKEN" --yes 2>/dev/null; \
                 printf '%s' "$val" | npx vercel env add "$key" production --token "$VERCEL_TOKEN" --yes)
            done
          fi
          if [ -z "${SMTP_PASS:-}" ]; then
            echo "::warning::SMTP_PASS not set — skipped mail env sync"
            exit 0
          fi
          for pair in \
            "SMTP_HOST=${SMTP_HOST}" \
            "SMTP_USER=${SMTP_USER}" \
            "SMTP_PORT=587" \
            "MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS}" \
            "USE_SES_API=true"; do
            key="${pair%%=*}"
            val="${pair#*=}"
            printf '%s' "$val" | npx vercel env add "$key" production --token "$VERCEL_TOKEN" --yes 2>/dev/null || \
              printf '%s' "$val" | npx vercel env rm "$key" production --token "$VERCEL_TOKEN" --yes 2>/dev/null; \
              printf '%s' "$val" | npx vercel env add "$key" production --token "$VERCEL_TOKEN" --yes
          done
          printf '%s' "$SMTP_PASS" | npx vercel env add SMTP_PASS production --token "$VERCEL_TOKEN" --yes 2>/dev/null || \
            (npx vercel env rm SMTP_PASS production --token "$VERCEL_TOKEN" --yes 2>/dev/null; \
             printf '%s' "$SMTP_PASS" | npx vercel env add SMTP_PASS production --token "$VERCEL_TOKEN" --yes)

      - name: Deploy to Vercel (when token configured)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "${VERCEL_TOKEN:-}" ] || [ -z "${VERCEL_PROJECT_ID:-}" ]; then
            echo "::warning::VERCEL_TOKEN / VERCEL_PROJECT_ID not set — rely on Vercel GitHub auto-deploy"
            exit 0
          fi
          npx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          npx vercel build --prod --token "$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN" --yes
