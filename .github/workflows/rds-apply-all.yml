# Apply all aws/scripts/*.sql to AWS RDS + redeploy Lambda (when GitHub secrets set).
#
# Secrets: DATABASE_URL, AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY (optional)

name: RDS Apply All SQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aws/scripts/**"
      - "aws/server/**"
      - "api/**"
      - ".github/workflows/rds-apply-all.yml"

concurrency:
  group: rds-apply-all
  cancel-in-progress: false

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rds-apply]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all RDS SQL (when DATABASE_URL secret set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_RDS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            npm run aws:rds:apply-all
          else
            echo "::warning::DATABASE_URL GitHub secret is empty — skipping direct RDS apply"
          fi

      - name: Configure AWS credentials
        if: secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'ap-south-1' }}

      - name: Bundle Lambda and update function code only
        if: secrets.AWS_ACCESS_KEY_ID != '' && secrets.AWS_SECRET_ACCESS_KEY != ''
        run: |
          node aws/scripts/bundle-lambda.mjs
          cd aws/lambda/dist && zip -r /tmp/lambda.zip . && cd -
          aws lambda update-function-code \
            --function-name ezyintern-api-staging \
            --zip-file fileb:///tmp/lambda.zip \
            --region ap-south-1
          aws lambda wait function-updated --function-name ezyintern-api-staging --region ap-south-1
          echo "Lambda updated"

      - name: Skip AWS deploy (no GitHub AWS secrets)
        if: secrets.AWS_ACCESS_KEY_ID == '' || secrets.AWS_SECRET_ACCESS_KEY == ''
        run: echo "::warning::AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY not set in GitHub — skipped Lambda deploy"
