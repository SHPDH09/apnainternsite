# Apply all aws/scripts/*.sql to AWS RDS + redeploy Lambda code (uses GitHub repo secrets).
#
# Secrets (GitHub → Settings → Secrets → Actions):
#   DATABASE_URL          — direct RDS apply (optional if Lambda deploy succeeds)
#   AWS_ACCESS_KEY_ID     — Lambda code-only update
#   AWS_SECRET_ACCESS_KEY
# Optional: RAZORPAY_*, SMTP_*, LOCAL_JWT_SECRET, ADMIN_TEST_PASSWORD

name: RDS Apply All SQL

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "aws/scripts/**"
      - "aws/server/**"
      - "api/**"
      - ".github/workflows/rds-apply-all.yml"

concurrency:
  group: rds-apply-all
  cancel-in-progress: false

jobs:
  apply-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[rds-apply]')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply all RDS SQL (when DATABASE_URL secret set)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AWS_RDS_DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "${DATABASE_URL:-}" ]; then
            npm run aws:rds:apply-all
          else
            echo "::warning::DATABASE_URL GitHub secret is empty — skipping direct RDS apply"
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || 'ap-south-1' }}

      - name: Bundle Lambda and update function code only
        run: |
          node aws/scripts/bundle-lambda.mjs
          cd aws/lambda/dist && zip -r /tmp/lambda.zip . && cd -
          aws lambda update-function-code \
            --function-name ezyintern-api-staging \
            --zip-file fileb:///tmp/lambda.zip \
            --region ap-south-1
          aws lambda wait function-updated --function-name ezyintern-api-staging --region ap-south-1
          echo "Lambda updated — cold start will apply all RDS SQL via DATABASE_URL already on Lambda"

      - name: Trigger cold start + verify upload RPC
        env:
          ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
        run: |
          curl -sS "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com/staging/api/health" || true
          sleep 20
          TOKEN=$(curl -sS -X POST "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com/staging/auth/v1/token?grant_type=password" \
            -H "Content-Type: application/json" -H "apikey: local-anon-key" \
            -d '{"email":"rk331159@gmail.com","password":"'"${ADMIN_TEST_PASSWORD:-Raunak@12583}"'"}' \
            | python3 -c "import sys,json; print(json.load(sys.stdin).get('access_token',''))")
          RESULT=$(curl -sS -X POST "https://eikmcrd7ei.execute-api.ap-south-1.amazonaws.com/staging/rest/v1/rpc/admin_student_data_upload_import" \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" -H "apikey: local-anon-key" \
            -d "{\"p_email\":\"ghactions$(date +%s)@example.com\",\"p_password\":\"Test@12345\",\"p_phone\":\"9876543210\",\"p_full_name\":\"GH Test\",\"p_registration_number\":\"REGGH$(date +%s)\",\"p_paid\":true}")
          echo "$RESULT"
          echo "$RESULT" | grep -q '"ok":true' || echo "::warning::Upload RPC verify did not return ok:true (may need second attempt after bootstrap)"
